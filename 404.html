<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Single Page App routing fix for GitHub Pages
    // Redirects all requests to the index.html
    const path = window.location.pathname;
    const segments = path.split('/');
    const lastSegment = segments[segments.length - 1];
    
    // If it's a direct access to the /ana-proj route, redirect properly
    if (path.includes('/ana-proj')) {
      localStorage.setItem('redirectPath', '/ana-proj');
      window.location.href = '/';
    } else {
      // Otherwise, store the path to redirect after loading index.html
      localStorage.setItem('redirectPath', path);
      window.location.href = '/';
    }
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
