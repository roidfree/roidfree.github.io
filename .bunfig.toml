[install]
# Ensure consistent installs across devices
exact = true
production = false
# saveTextLockfile = false  # Disabled due to Windows issues
# Use binary lockfile instead (bun.lockb)

# Registry configuration
registry = "https://registry.npmjs.org"

# Cache configuration for better cross-device consistency
cache = true

# Disable telemetry for privacy
telemetry = false

[run]
# Use Bun's runtime for better performance
bun = true
